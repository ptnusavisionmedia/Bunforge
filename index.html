<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2b2a" />
    <meta name="description" content="Pilih bahan, susun lapisannya, dan lihat hasilnya dalam 3D." />
    <link rel="preload" as="image" href="%BASE_URL%brand/bunforge-mark.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bunforge" />
    <meta property="og:title" content="Bunforge — Rakit Burger Versimu" />
    <meta property="og:description" content="Pilih bahan, susun lapisannya, dan lihat hasilnya dalam 3D." />
    <meta property="og:image" content="%BASE_URL%brand/bunforge-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bunforge dengan lapisan smashburger di atas panggangan." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Bunforge — Rakit Burger Versimu</title>
    <style>
      /* Loading screen: logo dirakit dari tiga lapis, lalu panggangan "menyala" */
      body.is-loading { overflow: hidden; }
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center; align-content: center; gap: 0;
        background:
          radial-gradient(ellipse 52% 40% at 50% 46%, #1b6158 0%, #0f3d39 42%, transparent 78%),
          #0a2b2a;
        color: #eaf4f1;
        font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        transition: opacity .55s cubic-bezier(.2,.8,.2,1) .1s, clip-path .75s cubic-bezier(.7,0,.2,1);
        clip-path: inset(0 0 0 0);
      }
      #splash.is-leaving { opacity: 0; clip-path: inset(0 0 100% 0); pointer-events: none; }
      .splash-stage { position: relative; width: clamp(132px, 26vmin, 188px); aspect-ratio: 1; }
      .splash-glow {
        position: absolute; inset: -42%; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, #f2b21b55 0%, #f2b21b1a 38%, transparent 66%);
        opacity: 0; animation: sp-glow-in .9s ease-out 1.35s forwards, sp-glow 2.4s ease-in-out 2.25s infinite;
      }
      .splash-layer {
        position: absolute; inset: 0; width: 100%; height: 100%;
        opacity: 0; transform: translateY(-120%);
        animation: sp-drop .78s cubic-bezier(.34,1.5,.5,1) forwards;
        will-change: transform, opacity; filter: brightness(1.28) saturate(1.12);
      }
      .splash-layer[data-layer='bottom'] { clip-path: inset(81.5% 0 0 0); animation-delay: .1s; }
      .splash-layer[data-layer='patty']  { clip-path: inset(67% 0 19% 0);  animation-delay: .42s; }
      .splash-layer[data-layer='top']    { clip-path: inset(0 0 34% 0);    animation-delay: .78s; transform-origin: 50% 66%; }
      .splash-stack { position: absolute; inset: 0; animation: sp-squash .5s cubic-bezier(.3,1.4,.5,1) 1.5s both; transform-origin: 50% 92%; }
      .splash-embers { position: absolute; left: 22%; right: 22%; top: 24%; height: 40%; pointer-events: none; }
      .splash-embers i {
        position: absolute; bottom: 0; left: var(--x); width: var(--s); height: var(--s);
        border-radius: 50%; background: #ffc63d; opacity: 0;
        animation: sp-ember var(--d) ease-out var(--t) infinite;
      }
      .splash-name { display: flex; margin-top: clamp(18px, 3.4vmin, 28px); font-weight: 800; font-size: clamp(34px, 6.4vmin, 48px); line-height: 1; letter-spacing: .01em; overflow: hidden; padding-bottom: 4px; }
      .splash-name span { display: inline-block; transform: translateY(110%); animation: sp-letter .6s cubic-bezier(.2,.9,.25,1.1) forwards; animation-delay: calc(1.5s + var(--i) * 55ms); }
      .splash-meter { position: relative; width: clamp(120px, 22vmin, 164px); height: 3px; margin-top: 18px; border-radius: 3px; background: #ffffff1f; overflow: hidden; opacity: 0; animation: sp-fade .5s ease-out 1.9s forwards; }
      .splash-meter::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 42%; border-radius: 3px; background: linear-gradient(90deg, #f2b21b, #ffc63d); animation: sp-sweep 1.25s cubic-bezier(.65,0,.35,1) 1.9s infinite; }
      .splash-note { margin: 12px 0 0; font: 500 13px/1.3 Inter, system-ui, sans-serif; color: #b6d1cb; opacity: 0; animation: sp-fade .5s ease-out 2s forwards; }
      @keyframes sp-drop { 0% { opacity: 0; transform: translateY(-120%) scaleY(1.1); } 12% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes sp-squash { 0% { transform: scale(1,1); } 40% { transform: scale(1.05,.93); } 100% { transform: scale(1,1); } }
      @keyframes sp-letter { to { transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-glow-in { to { opacity: 1; } }
      @keyframes sp-glow { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.08); } }
      @keyframes sp-sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes sp-ember { 0% { opacity: 0; transform: translateY(0) scale(1); } 15% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -120px) scale(.3); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-layer, .splash-name span, .splash-meter, .splash-note, .splash-glow { animation: none !important; opacity: 1; transform: none; }
        .splash-embers, .splash-meter::after { display: none; }
        #splash { transition: opacity .3s linear; clip-path: none; }
        #splash.is-leaving { clip-path: none; }
      }
    </style>
  </head>
  <body class="is-loading">
    <div id="splash" role="status" aria-live="polite">
      <div class="splash-stage" aria-hidden="true">
        <div class="splash-glow"></div>
        <div class="splash-stack">
          <img class="splash-layer" data-layer="bottom" src="%BASE_URL%brand/bunforge-mark.png" alt="" width="512" height="512" />
          <img class="splash-layer" data-layer="patty" src="%BASE_URL%brand/bunforge-mark.png" alt="" width="512" height="512" />
          <img class="splash-layer" data-layer="top" src="%BASE_URL%brand/bunforge-mark.png" alt="" width="512" height="512" />
        </div>
        <div class="splash-embers">
          <i style="--x:18%;--s:5px;--d:2.1s;--t:1.8s;--dx:-14px"></i>
          <i style="--x:38%;--s:4px;--d:1.8s;--t:2.2s;--dx:10px"></i>
          <i style="--x:52%;--s:6px;--d:2.4s;--t:2.0s;--dx:-6px"></i>
          <i style="--x:66%;--s:4px;--d:1.9s;--t:2.6s;--dx:16px"></i>
          <i style="--x:80%;--s:5px;--d:2.2s;--t:2.35s;--dx:8px"></i>
          <i style="--x:28%;--s:3px;--d:1.7s;--t:3.0s;--dx:-10px"></i>
        </div>
      </div>
      <div class="splash-name" aria-hidden="true"><span style="--i:0">B</span><span style="--i:1">u</span><span style="--i:2">n</span><span style="--i:3">f</span><span style="--i:4">o</span><span style="--i:5">r</span><span style="--i:6">g</span><span style="--i:7">e</span></div>
      <div class="splash-meter" aria-hidden="true"></div>
      <p class="splash-note">Menyalakan panggangan…</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        if (!el) return;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = sessionStorage.getItem('bunforge-splash') === '1'; sessionStorage.setItem('bunforge-splash', '1'); } catch (e) {}
        var min = reduce ? 350 : seen ? 1100 : 2600;
        var start = performance.now();
        var done = false, queued = false;
        function leave() {
          if (done) return;
          done = true;
          el.classList.add('is-leaving');
          document.body.classList.remove('is-loading');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
        }
        window.addEventListener('bunforge:ready', function () {
          if (queued) return;
          queued = true;
          setTimeout(leave, Math.max(0, min - (performance.now() - start)));
        });
        setTimeout(leave, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
