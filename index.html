<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a2b2a" />
    <meta name="description" content="Pilih bahan, susun lapisannya, dan lihat hasilnya dalam 3D." />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bunforge" />
    <meta property="og:title" content="Bunforge — Rakit Burger Versimu" />
    <meta property="og:description" content="Pilih bahan, susun lapisannya, dan lihat hasilnya dalam 3D." />
    <meta property="og:image" content="%BASE_URL%brand/bunforge-share.jpg" />
    <meta property="og:image:width" content="1200" />

    <title>Bunforge — Rakit Burger Versimu</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="%BASE_URL%fonts/barlow-condensed-latin-800-normal.woff2" />
    <link rel="preload" as="image" href="%BASE_URL%brand/logo-dome.png" />
    <style>
      @font-face { font-family: 'Bunforge Splash'; font-weight: 800; font-display: block; src: url('%BASE_URL%fonts/barlow-condensed-latin-800-normal.woff2') format('woff2'); }
      body.is-loading { overflow: hidden; }
      #splash {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0a2b2a; color: #eaf4f1;
        transition: opacity .55s cubic-bezier(.4,0,.2,1);
      }
      #splash.is-leaving { opacity: 0; pointer-events: none; }
      .splash-bg {
        position: absolute; inset: -10%; pointer-events: none;
        background: radial-gradient(ellipse 46% 38% at 50% 46%, #1d6a60 0%, #0f3f3b 46%, transparent 80%);
        opacity: 0; animation: sp-fade .9s ease-out .05s forwards;
      }
      .splash-content { position: relative; display: flex; flex-direction: column; align-items: center; transition: transform .6s cubic-bezier(.4,0,.2,1); }
      #splash.is-leaving .splash-content { transform: scale(1.06); }
      .splash-stage { position: relative; width: clamp(140px, 27vmin, 196px); aspect-ratio: 1; }
      .splash-halo {
        position: absolute; inset: -38%; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, #ffc63d44 0%, #ffc63d14 40%, transparent 68%);
        opacity: 0; transform: scale(.8);
        animation: sp-halo-in .8s cubic-bezier(.2,.8,.2,1) 1.15s forwards, sp-halo 2.6s ease-in-out 2s infinite;
      }
      .splash-stack { position: absolute; inset: 0; transform-origin: 50% 90%; animation: sp-squash .55s cubic-bezier(.3,1.5,.5,1) 1.16s both; }
      .lay {
        position: absolute; inset: 0;
        -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
        opacity: 0; transform: translateY(-130%);
        animation: sp-drop .62s cubic-bezier(.3,1.35,.5,1) var(--d) forwards;
        will-change: transform, opacity;
      }
      .lay-base  { --m: url('%BASE_URL%brand/logo-base.png');  --d: .1s;  background: linear-gradient(180deg, #ffd45e, #f0a312); }
      .lay-patty { --m: url('%BASE_URL%brand/logo-patty.png'); --d: .32s; background: linear-gradient(180deg, #d7612a, #a8431a); }
      .lay-dome  { --m: url('%BASE_URL%brand/logo-dome.png');  --d: .54s; background: linear-gradient(180deg, #ffd96a 0%, #f4ab1e 100%); }
      .lay-flame {
        --m: url('%BASE_URL%brand/logo-flame.png'); --d: 0s;
        background: linear-gradient(0deg, #ff9d1c 0%, #ffd85a 55%, #fff1a8 100%);
        transform: scale(.2, .05); transform-origin: 50% 58%;
        animation: sp-ignite .55s cubic-bezier(.3,1.25,.5,1) 1.12s forwards, sp-flicker 1.5s ease-in-out 1.7s infinite alternate;
        z-index: -1;
      }
      .splash-embers { position: absolute; left: 24%; right: 24%; top: 6%; height: 40%; pointer-events: none; }
      .splash-embers i {
        position: absolute; bottom: 0; left: var(--x); width: var(--s); height: var(--s);
        border-radius: 50%; background: #ffd45e; opacity: 0;
        animation: sp-ember var(--t2) ease-out var(--t) infinite;
      }
      .splash-name {
        display: flex; margin-top: clamp(18px, 3.4vmin, 28px);
        font: 800 clamp(36px, 6.6vmin, 50px)/1 'Bunforge Splash', 'Barlow Condensed', 'Arial Narrow', sans-serif;
        letter-spacing: .01em; overflow: hidden; padding: 0 2px 6px;
      }
      .splash-name span { display: inline-block; transform: translateY(115%); }
      #splash.is-font .splash-name span { animation: sp-letter .55s cubic-bezier(.2,.9,.25,1.1) forwards; animation-delay: calc(1.25s + var(--i) * 45ms); }
      .splash-meter { position: relative; width: clamp(124px, 22vmin, 168px); height: 3px; margin-top: 16px; border-radius: 3px; background: #ffffff1c; overflow: hidden; opacity: 0; animation: sp-fade .5s ease-out 1.6s forwards; }
      .splash-meter::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #f0a312, #ffd45e); animation: sp-sweep 1.2s cubic-bezier(.65,0,.35,1) 1.6s infinite; will-change: transform; }
      .splash-note { margin: 12px 0 0; font: 500 13px/1.3 Inter, system-ui, sans-serif; color: #b6d1cb; opacity: 0; animation: sp-fade .5s ease-out 1.75s forwards; }
      @keyframes sp-drop { 0% { opacity: 0; transform: translateY(-130%); } 10% { opacity: 1; } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes sp-ignite { 0% { opacity: 0; transform: scale(.2,.05); } 40% { opacity: 1; } 100% { opacity: 1; transform: scale(1,1); } }
      @keyframes sp-flicker { 0% { transform: scale(1,1) skewX(0deg); } 35% { transform: scale(.985,1.035) skewX(-1.4deg); } 70% { transform: scale(1.01,.985) skewX(1.1deg); } 100% { transform: scale(.99,1.045) skewX(-.6deg); } }
      @keyframes sp-squash { 0% { transform: scale(1,1); } 38% { transform: scale(1.045,.94); } 100% { transform: scale(1,1); } }
      @keyframes sp-letter { to { transform: translateY(0); } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-halo-in { to { opacity: 1; transform: scale(1); } }
      @keyframes sp-halo { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.08); } }
      @keyframes sp-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @keyframes sp-ember { 0% { opacity: 0; transform: translate(0,0) scale(1); } 15% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), -110px) scale(.3); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-bg, .lay, .splash-halo, .splash-stack, .splash-meter, .splash-note { animation: none !important; opacity: 1; transform: none; }
        .splash-name span { animation: none !important; transform: none; }
        .splash-embers, .splash-meter::after { display: none; }
        .splash-content { transition: none; }
        #splash.is-leaving .splash-content { transform: none; }
        #splash { transition: opacity .3s linear; }
      }
    </style>
  </head>
  <body class="is-loading">
    <div id="splash" role="status" aria-live="polite" aria-label="Memuat Bunforge">
      <div class="splash-bg"></div>
      <div class="splash-content">
        <div class="splash-stage" aria-hidden="true">
          <div class="splash-halo"></div>
          <div class="splash-stack">
            <div class="lay lay-flame"></div>
            <div class="lay lay-base"></div>
            <div class="lay lay-patty"></div>
            <div class="lay lay-dome"></div>
          </div>
          <div class="splash-embers">
            <i style="--x:20%;--s:5px;--t2:2.1s;--t:2.1s;--dx:-14px"></i>
            <i style="--x:40%;--s:4px;--t2:1.8s;--t:2.5s;--dx:10px"></i>
            <i style="--x:54%;--s:6px;--t2:2.4s;--t:2.3s;--dx:-6px"></i>
            <i style="--x:68%;--s:4px;--t2:1.9s;--t:2.9s;--dx:16px"></i>
            <i style="--x:80%;--s:5px;--t2:2.2s;--t:2.7s;--dx:8px"></i>
            <i style="--x:30%;--s:3px;--t2:1.7s;--t:3.3s;--dx:-10px"></i>
          </div>
        </div>
        <div class="splash-name" aria-hidden="true"><span style="--i:0">B</span><span style="--i:1">u</span><span style="--i:2">n</span><span style="--i:3">f</span><span style="--i:4">o</span><span style="--i:5">r</span><span style="--i:6">g</span><span style="--i:7">e</span></div>
        <div class="splash-meter" aria-hidden="true"></div>
        <p class="splash-note">Menyalakan panggangan…</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var el = document.getElementById('splash');
        if (!el) return;
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var INTRO = reduce ? 0 : 2000;   // animasi masuk selesai, baru boleh memuat scene 3D
        var MIN = reduce ? 350 : 2400;   // tampil minimal agar animasi tidak terpotong
        var start = performance.now();
        var done = false, queued = false, introSent = false;
        function intro() {
          if (introSent) return;
          introSent = true;
          window.dispatchEvent(new Event('bunforge:intro'));
        }
        function leave() {
          if (done) return;
          done = true;
          intro();
          el.classList.add('is-leaving');
          document.body.classList.remove('is-loading');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 800);
        }
        function fontOn() { el.classList.add('is-font'); }
        if (document.fonts && document.fonts.load) {
          Promise.race([
            document.fonts.load("800 40px 'Bunforge Splash'"),
            new Promise(function (r) { setTimeout(r, 700); })
          ]).then(fontOn, fontOn);
        } else { fontOn(); }
        setTimeout(intro, INTRO);
        window.addEventListener('bunforge:ready', function () {
          if (queued) return;
          queued = true;
          setTimeout(leave, Math.max(0, MIN - (performance.now() - start)));
        });
        setTimeout(leave, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
